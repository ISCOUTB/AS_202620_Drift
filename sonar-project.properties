sonar.organization=isco-utb
sonar.projectKey=ISCOUTB_AS_202620_Drift

sonar.sources=backend/app,frontend
sonar.tests=backend/tests
sonar.exclusions=frontend/node_modules/**,frontend/.next/**

# Cobertura: la generan las pruebas del backend en el job de CI.
sonar.python.coverage.reportPaths=backend/coverage.xml
# El frontend todavia no tiene pruebas automatizadas: no entra en la cobertura.
sonar.coverage.exclusions=frontend/**
