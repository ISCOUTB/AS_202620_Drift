version: 2
updates:
  # Backend. Dependabot solo edita requirements.txt: requirements.lock (con hashes,
  # el que usa el Dockerfile) se regenera a mano con pip-compile. Ver
  # docs/evidencias/s13-analisis-dependencias.md, §5.
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Un solo grupo: así pydantic y pydantic-core (que pydantic fija de forma
    # exacta) siempre llegan juntos en el mismo PR.
    groups:
      backend:
        patterns: ["*"]

  # Frontend. react y react-dom deben ir siempre en la misma versión.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      react:
        patterns: ["react", "react-dom"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      acciones:
        patterns: ["*"]
