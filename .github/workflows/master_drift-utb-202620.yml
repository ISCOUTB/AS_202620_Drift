name: Build and deploy Python app to Azure Web App - drift-utb-202620

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python version
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
            python -m pip install --only-binary :all: fastapi==0.141.1 httpx==0.28.1 pytest==9.0.1 uvicorn==0.54.0 schemathesis==4.27.5

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D4F801D00E2E44E8A456C38607E987DE }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_4FE559CAB8714150A03C750BFB27C938 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_CFC582F4DC534E1682A9FB6C4E2D1C8C }}

      - name: Deploy backend to Azure Web App
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
        with:
          app-name: "drift-utb-202620"
          slot-name: "Production"
          package: "./backend"
