name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend-tests:
    name: Pruebas del backend
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi==0.141.1 httpx==0.28.1 pytest uvicorn==0.52.4

      - name: Ejecutar pruebas unitarias y del corte vertical
        working-directory: backend
        run: python -m pytest tests -q

  frontend-api-smoke:
    name: Frontend conectado a la API
    runs-on: ubuntu-latest
    needs: backend-tests

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del backend
        run: python -m pip install fastapi==0.141.1 httpx==0.28.1 uvicorn==0.52.4

      - name: Iniciar API y comprobar salud
        run: |
          cd backend
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/drift-api.log" 2>&1 &
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/ | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/drift-api.log"
          exit 1

      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm ci

      - name: Compilar el frontend configurado para la API local
        working-directory: frontend
        env:
          NEXT_PUBLIC_DRIFT_API_URL: http://127.0.0.1:8000
        run: npm run build

      - name: Servir el frontend y comprobar la portada
        working-directory: frontend
        env:
          NEXT_PUBLIC_DRIFT_API_URL: http://127.0.0.1:8000
        run: |
          npm run dev -- --hostname 127.0.0.1 --port 3000 > "$RUNNER_TEMP/drift-frontend.log" 2>&1 &
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3000/ | grep -q 'DRIFT'; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/drift-frontend.log"
          exit 1
