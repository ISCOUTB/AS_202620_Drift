name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  backend-tests:
    name: Pruebas del backend
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi==0.141.1 httpx==0.28.1 pytest uvicorn==0.52.4

      - name: Ejecutar pruebas unitarias y del corte vertical
        working-directory: backend
        run: python -m pytest tests -q

  frontend-api-smoke:
    name: Frontend conectado a la API
    runs-on: ubuntu-latest
    needs: backend-tests

    steps:
      - name: Descargar código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del backend
        run: python -m pip install fastapi==0.141.1 httpx==0.28.1 uvicorn==0.52.4

      - name: Iniciar API y comprobar salud
        run: |
          cd backend
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/drift-api.log" 2>&1 &
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/ | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/drift-api.log"
          exit 1

      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Compilar el frontend configurado para la API local
        working-directory: frontend
        env:
          NEXT_PUBLIC_DRIFT_API_URL: http://127.0.0.1:8000
        run: npm run build

      - name: Servir el frontend y comprobar la portada
        working-directory: frontend
        env:
          NEXT_PUBLIC_DRIFT_API_URL: http://127.0.0.1:8000
        run: |
          npm run dev -- --hostname 127.0.0.1 --port 3000 > "$RUNNER_TEMP/drift-frontend.log" 2>&1 &
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3000/ | grep -q 'DRIFT'; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/drift-frontend.log"
          exit 1

  sonarcloud:
    name: Análisis con SonarQube Cloud
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-api-smoke]

    steps:
      - name: Descargar código con historial completo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Analizar calidad del código
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true