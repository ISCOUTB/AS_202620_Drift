name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  backend-tests:
    name: Pruebas del backend
    runs-on: ubuntu-latest

    # PostgreSQL desechable para las pruebas del almacén de copias (ADR-0014).
    # La contraseña solo existe dentro de este job.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: drift_test
          POSTGRES_USER: drift
          POSTGRES_PASSWORD: solo-para-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U drift -d drift_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Descargar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --only-binary :all: -r backend/requirements.txt

      - name: Iniciar API para pruebas de contrato
        working-directory: backend
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > api.log 2>&1 &
          
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/ | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 1
          done

          cat api.log
          exit 1

      - name: Ejecutar contrato de la API DRIFT
        run: |
          schemathesis run docs/api/drift/openapi.yaml \
            --url http://127.0.0.1:8000 \
            --max-examples 5 \
            --seed 42
          
      - name: Ejecutar pruebas unitarias y del corte vertical
        working-directory: backend
        env:
          DRIFT_TEST_DATABASE_URL: postgresql://drift:solo-para-ci@127.0.0.1:5432/drift_test
        run: python -m pytest tests -q

  frontend-api-smoke:
    name: Frontend conectado a la API
    runs-on: ubuntu-latest
    needs: backend-tests

    steps:
      - name: Descargar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: |
          python -m pip install --only-binary :all: -r backend/requirements.txt
      
      - name: Iniciar API y comprobar salud
        run: |
          cd backend
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/drift-api.log" 2>&1 &
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/ | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/drift-api.log"
          exit 1

      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Compilar el frontend configurado para la API local
        working-directory: frontend
        env:
          NEXT_PUBLIC_DRIFT_API_URL: http://127.0.0.1:8000
        run: npm run build

      - name: Servir el frontend y comprobar la portada
        working-directory: frontend
        env:
          NEXT_PUBLIC_DRIFT_API_URL: http://127.0.0.1:8000
        run: |
          npm run dev -- --hostname 127.0.0.1 --port 3000 > "$RUNNER_TEMP/drift-frontend.log" 2>&1 &
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3000/ | grep -q 'DRIFT'; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/drift-frontend.log"
          exit 1

  sonarqube:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-api-smoke]
    permissions:
      contents: read

    # El mismo PostgreSQL desechable del job de pruebas: sin él, el adaptador
    # de PostgreSQL quedaría sin cobertura (ADR-0014).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: drift_test
          POSTGRES_USER: drift
          POSTGRES_PASSWORD: solo-para-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U drift -d drift_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Descargar código para análisis
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Instalar dependencias para cobertura
        run: |
          python -m pip install --only-binary :all: -r backend/requirements.txt pytest-cov==7.1.0 coverage==7.16.2

      # El contrato ya se ejecuta en el job de pruebas del backend.
      - name: Ejecutar pruebas y generar cobertura del backend
        working-directory: backend
        env:
          DRIFT_TEST_DATABASE_URL: postgresql://drift:solo-para-ci@127.0.0.1:5432/drift_test
        run: python -m pytest tests -q --ignore=tests/test_contract.py --cov=app --cov-branch --cov-report=xml:coverage.xml

      # Lee sonar-project.properties. Con qualitygate.wait el job falla si el
      # Quality Gate no pasa, así el pipeline bloquea la integración.
      - name: Analizar con SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304
        with:
          args: >
            -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      
  dependency-audit:
    name: Análisis de dependencias
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # Audita lo que realmente se despliega: el lock con hashes que usa el Dockerfile.
      - name: Auditar dependencias del backend (pip-audit)
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit -r backend/requirements.lock --require-hashes --strict

      - name: Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # Falla si hay vulnerabilidades altas o críticas en las dependencias de producción.
      - name: Auditar dependencias del frontend (npm audit)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
