openapi: 3.1.0

info:
  title: DRIFT API
  version: 1.4.0
  description: |
    Contrato HTTP de la API de DRIFT.
    Permite consultar el estado del servicio, buscar videojuegos,
    sincronizar el catálogo de PlayStation y estimar la compatibilidad
    de un juego con un computador.

servers:
  - url: http://localhost:8000
    description: Entorno local

tags:
  - name: Estado
    description: Verificación de disponibilidad de la API.
  - name: Juegos
    description: Búsqueda y consulta de videojuegos.
  - name: Compatibilidad
    description: Estimación de compatibilidad de PC.

paths:

  /:
    get:
      tags:
        - Estado
      summary: Consultar estado de la API
      operationId: getHealthStatus
      responses:
        "200":
          description: La API está disponible.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok


  /games/search:
    get:
      tags:
        - Juegos
      summary: Buscar videojuegos por nombre
      operationId: searchGames

      parameters:
        - name: q
          in: query
          required: true
          description: Texto utilizado para buscar videojuegos.
          schema:
            type: string
            minLength: 1
          example: Portal 2

      responses:
        "200":
          description: Lista de videojuegos encontrados.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GameSearchResult"

        "422":
          description: Parámetro de búsqueda ausente o inválido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"


  /games/sync/playstation:
    post:
      tags:
        - Juegos
      summary: Sincronizar el catálogo de PlayStation
      operationId: syncPlayStationCatalog

      responses:
        "200":
          description: Catálogo de PlayStation sincronizado correctamente.
          content:
            application/json:
              schema:
                type: object

        "503":
          description: No fue posible actualizar el catálogo de PlayStation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncError"


  /games/{game_id}/compatibility:
    post:
      tags:
        - Compatibilidad

      summary: Estimar compatibilidad de un juego con un PC

      operationId: estimateCompatibility

      parameters:
        - name: game_id
          in: path
          required: true
          description: Identificador del videojuego.
          schema:
            type: integer
          example: 620


      requestBody:
        required: true
        description: Capacidades principales del computador del usuario.

        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompatibilityRequest"

            example:
              ram_gb: 16
              gpu_score: 4
              gpu_name: NVIDIA GeForce RTX 3060
              cpu_score: 4
              cpu_name: AMD Ryzen 5 5600
              storage_gb: 200


      responses:

        "200":
          description: Resultado de la estimación o aviso de requisitos no disponibles.

          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/CompatibilityResult"
                  - $ref: "#/components/schemas/RequirementsUnavailable"


        "400":
          description: Error al interpretar el cuerpo de la solicitud.

          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string


        "422":
          description: Cuerpo de solicitud o identificador inválido.

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"



  /hardware/gpus:
    get:
      tags:
        - Compatibilidad

      summary: Listar tarjetas gráficas para el buscador de «Mi PC»

      description: >
        Nombres y nivel aproximado de las tarjetas conocidas. No incluye los
        puntajes de benchmark: estos solo aparecen en el resultado de una
        estimación. La lista queda vacía si el despliegue no tiene configurada
        la copia de puntajes.

      operationId: listGraphicsCards

      responses:

        "200":
          description: Catálogo de tarjetas gráficas y origen de los puntajes.

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HardwareCatalogue"


  /hardware/cpus:
    get:
      tags:
        - Compatibilidad

      summary: Listar procesadores para el buscador de «Mi PC»

      description: >
        Nombres y nivel aproximado de los procesadores conocidos, sin
        puntajes de benchmark. La lista queda vacía si el despliegue no tiene
        configurada la copia de puntajes.

      operationId: listProcessors

      responses:

        "200":
          description: Catálogo de procesadores y origen de los puntajes.

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HardwareCatalogue"


components:

  schemas:


    HealthResponse:
      type: object

      required:
        - status

      properties:

        status:
          type: string
          example: ok



    SyncError:
      type: object

      required:
        - source
        - reason
        - local_data_preserved
        - occurred_at

      properties:

        source:
          type: string
          example: playstation

        reason:
          type: string
          example: Error al consultar la API de PlayStation

        http_status:
          type: integer
          nullable: true

        local_data_preserved:
          type: boolean

        occurred_at:
          type: string
          format: date-time



    GameSearchResult:
      type: object

      required:
        - id
        - name
        - prices
        - unavailable_sources

      properties:

        id:
          type: string

        name:
          type: string

        prices:
          type: object
          additionalProperties:
            type: number

        unavailable_sources:
          type: array
          description: Fuentes que fallaron o no respondieron dentro del plazo (Steam, CheapShark, PlayStation).
          items:
            type: string

        image:
          type:
            - string
            - "null"
          description: URL de la portada del juego, si alguna fuente la entrega.

        links:
          type: object
          description: Página de compra en cada tienda, con las mismas claves que prices. Una tienda puede no tener enlace.
          additionalProperties:
            type: string



    CompatibilityRequest:
      type: object

      required:
        - ram_gb
        - gpu_score

      properties:

        ram_gb:
          type: integer
          description: Memoria RAM disponible en GB.

        gpu_score:
          type: integer
          description: Nivel aproximado de la tarjeta gráfica, de 1 (integrada) a 5 (muy alta).

        gpu_name:
          type:
            - string
            - "null"
          maxLength: 120
          description: Modelo de la tarjeta gráfica. Si DRIFT lo reconoce, su nivel prevalece sobre gpu_score.

        storage_gb:
          type:
            - integer
            - "null"
          description: Espacio libre en disco en GB. Opcional.

        cpu_name:
          type:
            - string
            - "null"
          maxLength: 120
          description: Modelo del procesador. Opcional; sin él el procesador no se compara.

        cpu_score:
          type:
            - integer
            - "null"
          description: Nivel aproximado del procesador, de 1 a 5. Se usa si DRIFT no reconoce cpu_name.



    CompatibilityResult:
      type: object

      required:
        - game_id
        - status
        - minimum_ram_gb
        - recommended_ram_gb
        - minimum_gpu_score
        - recommended_gpu_score

      properties:

        game_id:
          type: integer

        status:
          type: string

        minimum_ram_gb:
          type: integer

        recommended_ram_gb:
          type: integer

        minimum_gpu_score:
          type:
            - integer
            - "null"
          description: Nulo cuando la fuente no publica una gráfica reconocible.

        recommended_gpu_score:
          type:
            - integer
            - "null"

        minimum_storage_gb:
          type:
            - integer
            - "null"

        recommended_storage_gb:
          type:
            - integer
            - "null"

        source:
          type: string
          description: Origen de los requisitos (Steam o DRIFT).

        gpu_score_used:
          type: integer

        gpu_recognized:
          type:
            - boolean
            - "null"

        gpu_benchmark:
          type:
            - object
            - "null"
          description: Origen del benchmark cuando la gráfica se comparó por puntaje; nulo si se comparó por niveles.

        minimum_cpu_score:
          type:
            - integer
            - "null"
          description: Nivel del procesador mínimo; nulo si la fuente no publica un modelo reconocible.

        recommended_cpu_score:
          type:
            - integer
            - "null"

        cpu_score_used:
          type:
            - integer
            - "null"

        cpu_recognized:
          type:
            - boolean
            - "null"

        cpu_benchmark:
          type:
            - object
            - "null"
          description: Origen del benchmark cuando el procesador se comparó por puntaje.

        partial:
          type: boolean
          description: Verdadero cuando algún componente no se pudo comparar.

        checks:
          type: array
          description: Resultado por componente (ram, cpu, gpu, storage).
          items:
            type: object

        requirements_text:
          type: object
          description: Texto de los requisitos tal como lo publica la fuente.



    HardwareCatalogue:
      type: object

      required:
        - items

      properties:

        source:
          type: string

        benchmark:
          type: string

        retrieved_at:
          type: string
          description: Fecha en que se tomó la copia de los puntajes.

        items:
          type: array

          items:
            type: object

            required:
              - name
              - laptop
              - level

            properties:

              name:
                type: string

              laptop:
                type: boolean

              level:
                type: integer
                description: Nivel aproximado de 1 a 5, usado cuando no hay puntaje para comparar.



    RequirementsUnavailable:
      type: object

      required:
        - game_id
        - status

      properties:

        game_id:
          type: integer

        status:
          type: string
          const: Requisitos no disponibles



    ValidationError:
      type: object

      description: Respuesta estándar de FastAPI ante datos inválidos.

      properties:

        detail:
          type: array

          items:
            type: object
