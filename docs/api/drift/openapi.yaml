openapi: 3.1.0

info:
  title: DRIFT API
  version: 1.0.0
  description: |
    Contrato HTTP de la API de DRIFT.
    Permite consultar el estado del servicio, buscar videojuegos,
    sincronizar el catálogo de PlayStation y estimar la compatibilidad
    de un juego con un computador.

servers:
  - url: http://localhost:8000
    description: Entorno local

tags:
  - name: Estado
    description: Verificación de disponibilidad de la API.
  - name: Juegos
    description: Búsqueda y consulta de videojuegos.
  - name: Compatibilidad
    description: Estimación de compatibilidad de PC.

paths:

  /:
    get:
      tags:
        - Estado
      summary: Consultar estado de la API
      operationId: getHealthStatus
      responses:
        "200":
          description: La API está disponible.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok


  /games/search:
    get:
      tags:
        - Juegos
      summary: Buscar videojuegos por nombre
      operationId: searchGames

      parameters:
        - name: q
          in: query
          required: true
          description: Texto utilizado para buscar videojuegos.
          schema:
            type: string
            minLength: 1
          example: Portal 2

      responses:
        "200":
          description: Lista de videojuegos encontrados.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GameSearchResult"

        "422":
          description: Parámetro de búsqueda ausente o inválido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"


  /games/sync/playstation:
    post:
      tags:
        - Juegos
      summary: Sincronizar el catálogo de PlayStation
      operationId: syncPlayStationCatalog

      responses:
        "200":
          description: Catálogo de PlayStation sincronizado correctamente.
          content:
            application/json:
              schema:
                type: object

        "503":
          description: No fue posible actualizar el catálogo de PlayStation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncError"


  /games/{game_id}/compatibility:
    post:
      tags:
        - Compatibilidad

      summary: Estimar compatibilidad de un juego con un PC

      operationId: estimateCompatibility

      parameters:
        - name: game_id
          in: path
          required: true
          description: Identificador del videojuego.
          schema:
            type: integer
          example: 620


      requestBody:
        required: true
        description: Capacidades principales del computador del usuario.

        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompatibilityRequest"

            example:
              ram_gb: 16
              gpu_score: 80


      responses:

        "200":
          description: Resultado de la estimación o aviso de requisitos no disponibles.

          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/CompatibilityResult"
                  - $ref: "#/components/schemas/RequirementsUnavailable"


        "400":
          description: Error al interpretar el cuerpo de la solicitud.

          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string


        "422":
          description: Cuerpo de solicitud o identificador inválido.

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"



components:

  schemas:


    HealthResponse:
      type: object

      required:
        - status

      properties:

        status:
          type: string
          example: ok



    SyncError:
      type: object

      required:
        - source
        - reason
        - local_data_preserved
        - occurred_at

      properties:

        source:
          type: string
          example: playstation

        reason:
          type: string
          example: Error al consultar la API de PlayStation

        http_status:
          type: integer
          nullable: true

        local_data_preserved:
          type: boolean

        occurred_at:
          type: string
          format: date-time



    GameSearchResult:
      type: object

      required:
        - id
        - name
        - prices
        - unavailable_sources

      properties:

        id:
          type: integer

        name:
          type: string

        prices:
          type: object
          additionalProperties:
            type: number

        unavailable_sources:
          type: array
          items:
            type: string



    CompatibilityRequest:
      type: object

      required:
        - ram_gb
        - gpu_score

      properties:

        ram_gb:
          type: integer
          description: Memoria RAM disponible en GB.

        gpu_score:
          type: integer
          description: Puntaje de GPU utilizado por DRIFT.



    CompatibilityResult:
      type: object

      required:
        - game_id
        - status
        - minimum_ram_gb
        - recommended_ram_gb
        - minimum_gpu_score
        - recommended_gpu_score

      properties:

        game_id:
          type: integer

        status:
          type: string

        minimum_ram_gb:
          type: integer

        recommended_ram_gb:
          type: integer

        minimum_gpu_score:
          type: integer

        recommended_gpu_score:
          type: integer



    RequirementsUnavailable:
      type: object

      required:
        - game_id
        - status

      properties:

        game_id:
          type: integer

        status:
          type: string
          const: Requisitos no disponibles



    ValidationError:
      type: object

      description: Respuesta estándar de FastAPI ante datos inválidos.

      properties:

        detail:
          type: array

          items:
            type: object