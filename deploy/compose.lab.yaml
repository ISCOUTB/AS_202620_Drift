# deploy/compose.lab.yaml — infraestructura como código de DRIFT en el servidor del laboratorio.
#
# Dokploy lo despliega en cada push a la rama principal con:
#   docker compose -p <app> --env-file deploy/.env -f deploy/compose.lab.yaml up -d --build
# Las rutas relativas (build.context) se resuelven desde deploy/, por eso se usa "../".
#
# Publicación (Dokploy → Domains), todo bajo https://drift.iscoutb.dev:
#   - web: Path "/",    Container Port 3000.
#   - api: Path "/api", Container Port 8000, Strip Path activado.
#
# Reglas del laboratorio:
#   - Sin "ports:": Traefik enruta el tráfico público; se usa "expose".
#   - Sin bind mounts, docker.sock, privileged, container_name ni redes externas.
#   - Límites en cada servicio: el total del equipo no pasa de 512 MB (aquí 480 MB).
#   - Secretos en Dokploy → Environment; aquí solo se referencian con ${VARIABLE}.
#
# Base de datos (ADR-0014): PostgreSQL guarda las copias de respaldo de las
# fuentes. Usa un volumen con nombre, no un bind mount. Antes de desplegar hay
# que definir DRIFT_DB_PASSWORD en Dokploy → Environment; sin ella el
# despliegue se detiene con un mensaje claro y sigue corriendo la versión anterior.

services:
  api:
    build:
      context: ../backend
    restart: unless-stopped
    environment:
      # El frontend se sirve desde el mismo dominio; se declara igual el origen permitido.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://drift.iscoutb.dev}
      # Tasa de respaldo si la API de tasa de cambio no responde.
      USD_TO_COP_RATE: ${USD_TO_COP_RATE:-3250}
      # Secretos: direcciones privadas de las copias de puntajes de gráficas
      # y procesadores. Los valores reales van en Dokploy → Environment. Sin
      # ellos, esos componentes se comparan por niveles aproximados.
      DRIFT_GPU_BENCHMARKS_URL: ${DRIFT_GPU_BENCHMARKS_URL:-}
      DRIFT_CPU_BENCHMARKS_URL: ${DRIFT_CPU_BENCHMARKS_URL:-}
      # Seguridad (ADR-0011 y ADR-0012). DRIFT_ADMIN_TOKEN es secreto: va en
      # Dokploy → Environment. Sin él, la sincronización y /metrics quedan deshabilitadas.
      DRIFT_ADMIN_TOKEN: ${DRIFT_ADMIN_TOKEN:-}
      DRIFT_RATE_LIMIT_PER_MINUTE: ${DRIFT_RATE_LIMIT_PER_MINUTE:-60}
      # Traefik agrega la IP real del cliente al final de X-Forwarded-For.
      DRIFT_TRUST_FORWARDED_FOR: "true"
      # Copias de respaldo en PostgreSQL (ADR-0014). La contraseña debe ser
      # segura para una URL: generarla con secrets.token_urlsafe.
      DRIFT_DATABASE_URL: postgresql://drift:${DRIFT_DB_PASSWORD:?Define DRIFT_DB_PASSWORD en Dokploy}@postgres:5432/drift
      # Secreto: llave de IsThereAnyDeal (tiendas de PC e historial de precios).
      # Sin ella se usa CheapShark y el historial queda deshabilitado.
      DRIFT_ITAD_API_KEY: ${DRIFT_ITAD_API_KEY:-}
      # Inicio de sesión con Google (ADR-0017). El Client Secret es secreto.
      # Sin estos valores el inicio de sesión queda deshabilitado.
      DRIFT_GOOGLE_CLIENT_ID: ${DRIFT_GOOGLE_CLIENT_ID:-}
      DRIFT_GOOGLE_CLIENT_SECRET: ${DRIFT_GOOGLE_CLIENT_SECRET:-}
      # Debe coincidir, letra por letra, con la URI registrada en Google.
      DRIFT_GOOGLE_REDIRECT_URI: ${DRIFT_GOOGLE_REDIRECT_URI:-https://drift.iscoutb.dev/api/auth/google/callback}
      DRIFT_FRONTEND_URL: ${DRIFT_FRONTEND_URL:-https://drift.iscoutb.dev}
      DRIFT_CACHE_FRESH_SECONDS: ${DRIFT_CACHE_FRESH_SECONDS:-900}
      DRIFT_CACHE_STALE_SECONDS: ${DRIFT_CACHE_STALE_SECONDS:-259200}
    # Solo el orden de arranque: la API funciona aunque PostgreSQL esté caído.
    depends_on:
      - postgres
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 192M

  web:
    build:
      context: ../frontend
      args:
        # Las variables NEXT_PUBLIC_* se fijan al compilar. La API queda en el mismo dominio.
        NEXT_PUBLIC_DRIFT_API_URL: /api
    restart: unless-stopped
    expose:
      - "3000"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 192M

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: drift
      POSTGRES_USER: drift
      POSTGRES_PASSWORD: ${DRIFT_DB_PASSWORD:?Define DRIFT_DB_PASSWORD en Dokploy}
    # Ajustes para caber en 96 MB: pocas conexiones y memoria compartida mínima.
    command:
      - postgres
      - -c
      - shared_buffers=16MB
      - -c
      - max_connections=12
      - -c
      - work_mem=1MB
      - -c
      - maintenance_work_mem=8MB
      - -c
      - effective_cache_size=48MB
      - -c
      - max_wal_size=64MB
    # Sin "ports:" ni "expose:" hacia Traefik: solo la API la alcanza por la red interna.
    volumes:
      - drift_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drift -d drift"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 96M

volumes:
  drift_pgdata:
